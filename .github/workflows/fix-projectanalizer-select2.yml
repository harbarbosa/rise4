name: Fix ProjectAnalizer Select2
on:
  push:
    branches: [clean-main]
    paths:
      - '.github/workflows/fix-projectanalizer-select2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix task modal Select2
        shell: python
        run: |
          from pathlib import Path
          p = Path('plugins/ProjectAnalizer/Views/tasks/modal_form.php')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace("class='select2 js_app_dropdown'", "class='select2'")
          s = s.replace('$("#task-form .js_app_dropdown").appDropdown();', '$("#task-form select.select2").each(function () { if (!$(this).data("select2")) { $(this).select2({width: "100%"}); } });')
          s = s.replace('$row.find(".labor-profile-select").select2();', 'initTaskResourceSelect($row.find(".labor-profile-select"));')
          s = s.replace('$("#task-materials-rows tr:last .material-select").select2();', 'initTaskResourceSelect($("#task-materials-rows tr:last .material-select"));')
          s = s.replace('$("#task-tools-rows tr:last .tool-select").select2();', 'initTaskResourceSelect($("#task-tools-rows tr:last .tool-select"));')
          old = '        $(".tool-select").select2();\n        $(".material-select").select2();\n\n        $(".labor-profile-select").select2();'
          new = '''        function initTaskResourceSelect($select) {
            if (!$select || !$select.length || $select.data("select2")) {
                return;
            }
            $select.select2({width: "100%"});
        }
        $("select.tool-select, select.material-select, select.labor-profile-select").each(function () {
            initTaskResourceSelect($(this));
        });'''
          if old not in s:
              raise SystemExit('Expected Select2 initialization block not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/ProjectAnalizer/Views/tasks/modal_form.php
          git commit -m "fix(ProjectAnalizer): correct Select2 initialization in task modal"
          git push origin HEAD:main
