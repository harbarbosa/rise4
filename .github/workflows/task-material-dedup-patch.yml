name: Apply task material dedup patch

on:
  push:
    branches:
      - fix/task-materials-deduplicate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task-materials-deduplicate
          fetch-depth: 0
      - name: Deduplicate proposal materials in task editor
        shell: python
        run: |
          from pathlib import Path
          path = Path('plugins/ProjectAnalizer/Views/tasks/modal_form.php')
          text = path.read_text(encoding='utf-8-sig')
          old = '''            $material_options = "<option value=''>" . app_lang("select_proposal_material") . "</option>";
            foreach ($proposal_materials as $material) {
                $label = ($material->item_title ?: $material->description_override ?: ("#" . $material->item_id));
                if ($material->item_unit) { $label .= " (" . $material->item_unit . ")"; }
                $material_options .= "<option value='" . esc($material->id) . "'>" . esc($label) . "</option>";
            }
'''
          new = '''            $material_options = "<option value=''>" . app_lang("select_proposal_material") . "</option>";
            $material_option_keys = array();
            foreach ($proposal_materials as $material) {
                $label = ($material->item_title ?: $material->description_override ?: ("#" . $material->item_id));
                if ($material->item_unit) { $label .= " (" . $material->item_unit . ")"; }

                // The same proposal material can exist in several stages. Show it only once.
                $material_key = function_exists('mb_strtolower') ? mb_strtolower(trim($label), 'UTF-8') : strtolower(trim($label));
                if (isset($material_option_keys[$material_key])) {
                    continue;
                }
                $material_option_keys[$material_key] = true;

                $material_options .= "<option value='" . esc($material->id) . "'>" . esc($label) . "</option>";
            }
'''
          if old not in text:
              raise SystemExit('Target material options block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/ProjectAnalizer/Views/tasks/modal_form.php
          git diff --cached --check
          git commit -m "fix: deduplicate task proposal materials"
          git push origin HEAD:fix/task-materials-deduplicate
